openapi: 3.0.3

info:
  title: 筋トレアプリ API
  version: 0.1.0
  description: |
    ## 共通ルール
    - 認証はFirebase AuthのIDトークンを `Authorization: Bearer <IDトークン>` で送る。
      「誰からのリクエストか」はトークンからサーバーが判断するため、
      リクエストに自分のユーザーIDを含めることはない。
    - 日時は ISO 8601（タイムゾーンのオフセット付き）で送受信する。

    ## 筋トレ記録（workout_records）と iOS アプリ（WorkoutLog）の対応
    記録のデータの形は、iOS アプリの `Workout` / `WorkoutExercise` / `WorkoutSet` / `Exercise` と
    同じにしている。アプリは記録を端末内に保存しており、その保存先をサーバーに置き換えられるようにするため。

    - 記録・種目・セットの ID はアプリが UUID で作る。電波がなくても記録でき、
      送信に失敗したときに同じ内容を送り直しても、記録が2つにならない（冪等）。
    - 「保存して終了」と「編集して保存」は、どちらも「その ID の記録を丸ごと置き換える」操作
      （`PUT /workout-records/{workoutId}`）。アプリも履歴の中の同じ ID の記録を差し替えている。

servers:
  - url: http://localhost:8787/api/v1
    description: ローカル開発
  - url: https://api.example.com/api/v1
    description: 本番（仮）

tags:
  - name: training_calendar
    description: 月間カレンダー表示用のトレーニング履歴
  - name: workout_records
    description: トレーニングの記録
  - name: users
    description: ユーザー

security:
  - firebaseAuth: []

paths:
  /me/training-calendar:
    get:
      tags:
        - training_calendar
      operationId: getMyTrainingCalendar
      summary: 自分の1ヶ月分のトレーニング履歴を取得する
      description: |
        指定した月の、ログイン中ユーザーのトレーニング履歴を日付ごとにまとめて返す。

        - IDOR対策としてFirebaseが発行するトークンをAuthorizationヘッダーに含める
        - 「何月何日か」の判定は、DBに保存されたユーザーのタイムゾーン
          （デフォルト Asia/Tokyo）を基準に行う。
        - トレーニングをしていない日は days に含めない。
        - 指定月にトレーニングが1件もない場合は、days を空配列で返す（404にはしない）。
      parameters:
        - name: month
          in: query
          required: true
          description: 取得する月。YYYY-MM 形式で、月は必ず2桁（ゼロ埋め）。
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingCalendarResponse'
              examples:
                has_training:
                  summary: トレーニング記録がある月
                  value:
                    month: '2026-10'
                    days:
                      - date: '2026-10-03'
                        body_parts:
                          - chest
                          - arms
                        sessions:
                          - session_id: 881
                            started_at: '2026-10-03T10:15:00+09:00'
                            exercises:
                              - exercise_id: 12
                                name: ベンチプレス
                                body_part: chest
                                sets:
                                  - weight_kg: 60
                                    reps: 10
                                  - weight_kg: 60
                                    reps: 8
                              - exercise_id: 31
                                name: トライセプスエクステンション
                                body_part: arms
                                sets:
                                  - weight_kg: 15
                                    reps: 12
                      - date: '2026-10-05'
                        body_parts:
                          - back
                        sessions:
                          - session_id: 902
                            started_at: '2026-10-05T19:40:00+09:00'
                            exercises:
                              - exercise_id: 20
                                name: デッドリフト
                                body_part: back
                                sets:
                                  - weight_kg: 100
                                    reps: 5
                empty_month:
                  summary: トレーニング記録がない月
                  value:
                    month: '2026-11'
                    days: []
        '400':
          description: month が未指定、または形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_month
                  message: month は YYYY-MM 形式で指定してください
        '401':
          description: ID トークンがない、不正、または有効期限切れ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthorized
                  message: 認証に失敗しました
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: サーバーでエラーが発生しました

  /users/me:
    put:
      tags:
        - users
      operationId: putMe
      summary: ログイン中のユーザーを登録する（初回ログイン時）
      description: |
        ID トークンのユーザーがまだ登録されていなければ登録し、登録済みならそのまま返す。
        アプリはログインした直後に毎回呼んでよい。

        - 本文は送らない。「誰か」は ID トークンからサーバーが判断する
        - 同じユーザーで何度呼んでも、ユーザーは1人しか作られない（冪等）
        - display_name と handle は、登録した直後は null
      responses:
        '200':
          description: すでに登録されていた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '201':
          description: 新しく登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: '7C9E6679-7425-40DE-944B-E07FC1F90AE7'
                display_name: null
                handle: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /workout-records:
    get:
      tags:
        - workout_records
      operationId: listWorkoutRecords
      summary: 自分のトレーニングの記録の一覧を取得する
      description: |
        ログイン中ユーザーの記録を、開始日時の新しい順で返す。
        iOS アプリは、この一覧から「前回の値」を探す（新しい順を前提にしている）。

        - from / to を省くと、すべての記録を返す
        - 該当する記録がない場合は、workout_records を空配列で返す（404にはしない）
      parameters:
        - name: from
          in: query
          required: false
          description: この日時以降に始めた記録だけを返す（この日時を含む）
          schema:
            type: string
            format: date-time
            example: '2026-10-01T00:00:00+09:00'
        - name: to
          in: query
          required: false
          description: この日時より前に始めた記録だけを返す（この日時は含まない）
          schema:
            type: string
            format: date-time
            example: '2026-11-01T00:00:00+09:00'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutRecordList'
              examples:
                has_records:
                  summary: 記録がある場合
                  value:
                    workout_records:
                      - id: '5C1E2B9A-7D0F-4E52-9B6A-2F1C0D8E4A11'
                        started_at: '2026-10-05T19:40:00+09:00'
                        ended_at: '2026-10-05T20:25:00+09:00'
                        exercises:
                          - id: '0B7F6C2D-3E4A-4F1B-8C9D-1A2B3C4D5E60'
                            exercise:
                              id: deadlift
                              name: デッドリフト
                              body_part: back
                            sets:
                              - id: '9E8D7C6B-5A49-4382-9170-6F5E4D3C2B1A'
                                weight: 100
                                reps: 5
                      - id: '3F2504E0-4F89-41D3-9A0C-0305E82C3301'
                        started_at: '2026-10-03T19:02:00+09:00'
                        ended_at: '2026-10-03T20:10:00+09:00'
                        exercises:
                          - id: 'A1B2C3D4-E5F6-4789-8ABC-DEF012345678'
                            exercise:
                              id: bench-press
                              name: ベンチプレス
                              body_part: chest
                            sets:
                              - id: '11111111-2222-4333-8444-555555555555'
                                weight: 60
                                reps: 10
                empty:
                  summary: 記録がない場合
                  value:
                    workout_records: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /workout-records/{workoutId}:
    parameters:
      - name: workoutId
        in: path
        required: true
        description: 記録の ID（アプリが作った UUID）
        schema:
          type: string
          format: uuid
          example: '3F2504E0-4F89-41D3-9A0C-0305E82C3301'

    put:
      tags:
        - workout_records
      operationId: putWorkoutRecord
      summary: 記録を保存する（新規登録と編集の両方）
      description: |
        その ID の記録がなければ新しく登録し、あれば丸ごと置き換える。
        アプリの「保存して終了」と「編集して保存」の両方で使う。

        - 同じ内容を何度送っても結果は同じ（冪等）。送信に失敗したら、そのまま送り直してよい
        - 本文の id はパスの workoutId と同じにする
        - 本文の記録は、アプリが保存するときと同じく「回数を入力したセット」だけを含める
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutRecord'
            example:
              id: '3F2504E0-4F89-41D3-9A0C-0305E82C3301'
              started_at: '2026-10-03T19:02:00+09:00'
              ended_at: '2026-10-03T20:10:00+09:00'
              exercises:
                - id: 'A1B2C3D4-E5F6-4789-8ABC-DEF012345678'
                  exercise:
                    id: bench-press
                    name: ベンチプレス
                    body_part: chest
                  sets:
                    - id: '11111111-2222-4333-8444-555555555555'
                      weight: 60
                      reps: 10
                    - id: '66666666-7777-4888-9999-AAAAAAAAAAAA'
                      weight: 60
                      reps: 8
                - id: 'BBBBBBBB-CCCC-4DDD-8EEE-FFFFFFFFFFFF'
                  exercise:
                    id: crunch
                    name: クランチ
                    body_part: abs
                  sets:
                    - id: '12345678-9ABC-4DEF-8123-456789ABCDEF'
                      weight: null
                      reps: 20
      responses:
        '200':
          description: 既存の記録を置き換えた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutRecord'
        '201':
          description: 新しく登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            この ID の記録がほかのユーザーのものとしてすでにある。
            UUID は通常重ならないため、ふつうは起きない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: id_conflict
                  message: この ID はすでに使われています
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - workout_records
      operationId: deleteWorkoutRecord
      summary: 記録を削除する
      description: |
        自分の記録を削除する。

        - 記録がない場合（削除済みを含む）も 204 を返す。送信に失敗して送り直したときに、
          エラーにならないようにするため
        - ほかのユーザーの記録の ID を指定しても削除はせず、204 を返す（記録があるかどうかを知られないため）
      responses:
        '204':
          description: 削除した（または、もともとなかった）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authで取得したIDトークン

  responses:
    BadRequest:
      description: パラメータや本文の形式が不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_request
              message: リクエストの形式が正しくありません
    Unauthorized:
      description: ID トークンがない、不正、または有効期限切れ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: 認証に失敗しました
    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: サーバーでエラーが発生しました

  schemas:
    TrainingCalendarResponse:
      type: object
      required:
        - month
        - days
      properties:
        month:
          type: string
          description: 対象の月（リクエストの month と同じ値）
          example: '2026-10'
        days:
          type: array
          description: トレーニングをした日の一覧。日付の昇順。
          items:
            $ref: '#/components/schemas/TrainingDay'

    TrainingDay:
      type: object
      required:
        - date
        - body_parts
        - sessions
      properties:
        date:
          type: string
          format: date
          description: ユーザーのタイムゾーン基準の日付
          example: '2026-10-03'
        body_parts:
          type: array
          description: |
            その日にトレーニングした部位の一覧（重複なし）。
            カレンダーのマス表示用の要約で、sessions 内の種目から算出する。
          items:
            $ref: '#/components/schemas/BodyPart'
        sessions:
          type: array
          description: その日のトレーニングセッション。開始時刻の昇順。
          items:
            $ref: '#/components/schemas/TrainingSession'

    TrainingSession:
      type: object
      required:
        - session_id
        - started_at
        - exercises
      properties:
        session_id:
          type: integer
          format: int64
          example: 881
        started_at:
          type: string
          format: date-time
          description: セッション開始日時（ISO 8601、タイムゾーンのオフセット付き）
          example: '2026-10-03T10:15:00+09:00'
        exercises:
          type: array
          description: 実施した種目。実施順。
          items:
            $ref: '#/components/schemas/ExerciseRecord'

    ExerciseRecord:
      type: object
      required:
        - exercise_id
        - name
        - body_part
        - sets
      properties:
        exercise_id:
          type: integer
          format: int64
          description: 種目マスタのID
          example: 12
        name:
          type: string
          description: 種目名（種目マスタの値をそのまま返す）
          example: ベンチプレス
        body_part:
          $ref: '#/components/schemas/BodyPart'
        sets:
          type: array
          description: セットの記録。実施順。
          items:
            $ref: '#/components/schemas/ExerciseSet'

    ExerciseSet:
      type: object
      required:
        - weight_kg
        - reps
      properties:
        weight_kg:
          type: number
          description: 重量（kg）。自重種目は 0。
          minimum: 0
          example: 60
        reps:
          type: integer
          description: 回数
          minimum: 1
          example: 10

    WorkoutRecordList:
      type: object
      required:
        - workout_records
      properties:
        workout_records:
          type: array
          description: 記録の一覧。開始日時の新しい順。
          items:
            $ref: '#/components/schemas/WorkoutRecord'

    WorkoutRecord:
      type: object
      description: 1回のトレーニング（iOS の `Workout`）
      required:
        - id
        - started_at
        - ended_at
        - exercises
      properties:
        id:
          type: string
          format: uuid
          description: アプリが作った UUID
        started_at:
          type: string
          format: date-time
          description: 開始日時
          example: '2026-10-03T19:02:00+09:00'
        ended_at:
          type: string
          format: date-time
          description: 終了日時。started_at 以降。
          example: '2026-10-03T20:10:00+09:00'
        exercises:
          type: array
          description: 行った種目。アプリで並べた順。
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkoutExercise'

    WorkoutExercise:
      type: object
      description: トレーニング内の1種目（iOS の `WorkoutExercise`）
      required:
        - id
        - exercise
        - sets
      properties:
        id:
          type: string
          format: uuid
          description: アプリが作った UUID。同じ種目を1回のトレーニングで2回行っても区別できる
        exercise:
          $ref: '#/components/schemas/Exercise'
        sets:
          type: array
          description: セット。実施順。
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkoutSet'

    Exercise:
      type: object
      description: |
        種目（iOS の `Exercise`）。記録には、記録したときの種目名と部位をそのまま保存する。
        今はアプリにあらかじめ用意した種目だけを使う。
      required:
        - id
        - name
        - body_part
      properties:
        id:
          type: string
          description: 種目の ID（英小文字とハイフン）
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: bench-press
        name:
          type: string
          description: 種目名
          minLength: 1
          example: ベンチプレス
        body_part:
          $ref: '#/components/schemas/BodyPart'

    WorkoutSet:
      type: object
      description: 1セット（iOS の `WorkoutSet`）
      required:
        - id
        - weight
        - reps
      properties:
        id:
          type: string
          format: uuid
          description: アプリが作った UUID
        weight:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: 重量（kg）。入力していない（自重など）ときは null。0kg とは区別する。
          example: 60
        reps:
          type: integer
          minimum: 0
          description: 回数
          example: 10
        memo:
          type: string
          default: ''
          description: セットごとのメモ（「補助あり」など）。省略したときは空文字として保存する。
          example: 補助あり

    BodyPart:
      type: string
      description: |
        部位コード。表示名（胸・背中など）への変換はフロントで行う。
        ※一覧は仮。最終的な分け方は別途決定する。
      enum:
        - chest
        - back
        - shoulders
        - arms
        - legs
        - abs
      example: chest

    User:
      type: object
      description: ユーザー
      required:
        - id
        - display_name
        - handle
      properties:
        id:
          type: string
          format: uuid
          description: サーバーが作ったユーザーの ID
        display_name:
          type: string
          nullable: true
          description: 表示名。まだ決めていなければ null
          example: おれん
        handle:
          type: string
          nullable: true
          description: ほかのユーザーから見える ID（@ は付けない）。まだ決めていなければ null
          example: oren

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: プログラムで判定するためのエラーコード
              example: invalid_month
            message:
              type: string
              description: 人が読むためのエラーメッセージ
              example: month は YYYY-MM 形式で指定してください

openapi: 3.0.3

info:
  title: 筋トレアプリ API
  version: 0.1.0
  description: |
    筋トレ記録とユーザー間の競争で継続を促すモバイルアプリのバックエンドAPI。

    ## 共通ルール
    - JSONの項目名はスネークケース。
    - 日時はすべてUTCのISO 8601形式（例: `2026-10-05T04:00:00Z`）。
    - 認証はFirebase AuthのIDトークンを `Authorization: Bearer <IDトークン>` で送る。
      「誰からのリクエストか」はトークンからサーバーが判断するため、
      リクエストに自分のユーザーIDを含めることはない。

    ## エラー
    エラー時は全API共通で `ErrorResponse` の形を返す。アプリは `error.code` で判定し、
    `error.message` は開発者向けの説明として扱う。

servers:
  - url: http://localhost:8787/api/v1
    description: ローカル開発
  - url: https://api.example.com/api/v1
    description: 本番（仮）

tags:
  - name: training_calendar
    description: 月間カレンダー表示用のトレーニング履歴

security:
  - firebaseAuth: []

paths:
  /me/training-calendar:
    get:
      tags:
        - training_calendar
      operationId: getMyTrainingCalendar
      summary: 自分の1ヶ月分のトレーニング履歴を取得する
      description: |
        指定した月の、ログイン中ユーザーのトレーニング履歴を日付ごとにまとめて返す。

        - IDOR対策としてFirebaseが発行するトークンをAuthorizationヘッダーに含める
        - 「何月何日か」の判定は、DBに保存されたユーザーのタイムゾーン
          （デフォルト Asia/Tokyo）を基準に行う。
        - トレーニングをしていない日は days に含めない。
        - 指定月にトレーニングが1件もない場合は、days を空配列で返す（404にはしない）。
      parameters:
        - name: month
          in: query
          required: true
          description: 取得する月。YYYY-MM 形式で、月は必ず2桁（ゼロ埋め）。
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: "2026-10"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingCalendarResponse"
              examples:
                has_training:
                  summary: トレーニング記録がある月
                  value:
                    month: "2026-10"
                    days:
                      - date: "2026-10-03"
                        body_parts:
                          - chest
                          - arms
                        sessions:
                          - session_id: 881
                            started_at: "2026-10-03T10:15:00+09:00"
                            exercises:
                              - exercise_id: 12
                                name: ベンチプレス
                                body_part: chest
                                sets:
                                  - weight_kg: 60
                                    reps: 10
                                  - weight_kg: 60
                                    reps: 8
                              - exercise_id: 31
                                name: トライセプスエクステンション
                                body_part: arms
                                sets:
                                  - weight_kg: 15
                                    reps: 12
                      - date: "2026-10-05"
                        body_parts:
                          - back
                        sessions:
                          - session_id: 902
                            started_at: "2026-10-05T19:40:00+09:00"
                            exercises:
                              - exercise_id: 20
                                name: デッドリフト
                                body_part: back
                                sets:
                                  - weight_kg: 100
                                    reps: 5
                empty_month:
                  summary: トレーニング記録がない月
                  value:
                    month: "2026-11"
                    days: []
        "400":
          description: month が未指定、または形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_month
                  message: month は YYYY-MM 形式で指定してください
        "401":
          description: ID トークンがない、不正、または有効期限切れ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: 認証に失敗しました
        "500":
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal_error
                  message: サーバーでエラーが発生しました

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authで取得したIDトークン

  schemas:
    TrainingCalendarResponse:
      type: object
      required:
        - month
        - days
      properties:
        month:
          type: string
          description: 対象の月（リクエストの month と同じ値）
          example: "2026-10"
        days:
          type: array
          description: トレーニングをした日の一覧。日付の昇順。
          items:
            $ref: "#/components/schemas/TrainingDay"

    TrainingDay:
      type: object
      required:
        - date
        - body_parts
        - sessions
      properties:
        date:
          type: string
          format: date
          description: ユーザーのタイムゾーン基準の日付
          example: "2026-10-03"
        body_parts:
          type: array
          description: |
            その日にトレーニングした部位の一覧（重複なし）。
            カレンダーのマス表示用の要約で、sessions 内の種目から算出する。
          items:
            $ref: "#/components/schemas/BodyPart"
        sessions:
          type: array
          description: その日のトレーニングセッション。開始時刻の昇順。
          items:
            $ref: "#/components/schemas/TrainingSession"

    TrainingSession:
      type: object
      required:
        - session_id
        - started_at
        - exercises
      properties:
        session_id:
          type: integer
          format: int64
          example: 881
        started_at:
          type: string
          format: date-time
          description: セッション開始日時（ISO 8601、タイムゾーンのオフセット付き）
          example: "2026-10-03T10:15:00+09:00"
        exercises:
          type: array
          description: 実施した種目。実施順。
          items:
            $ref: "#/components/schemas/ExerciseRecord"

    ExerciseRecord:
      type: object
      required:
        - exercise_id
        - name
        - body_part
        - sets
      properties:
        exercise_id:
          type: integer
          format: int64
          description: 種目マスタのID
          example: 12
        name:
          type: string
          description: 種目名（種目マスタの値をそのまま返す）
          example: ベンチプレス
        body_part:
          $ref: "#/components/schemas/BodyPart"
        sets:
          type: array
          description: セットの記録。実施順。
          items:
            $ref: "#/components/schemas/ExerciseSet"

    ExerciseSet:
      type: object
      required:
        - weight_kg
        - reps
      properties:
        weight_kg:
          type: number
          description: 重量（kg）。自重種目は 0。
          minimum: 0
          example: 60
        reps:
          type: integer
          description: 回数
          minimum: 1
          example: 10

    BodyPart:
      type: string
      description: |
        部位コード。表示名（胸・背中など）への変換はフロントで行う。
        ※一覧は仮。最終的な分け方は別途決定する。
      enum:
        - chest
        - back
        - shoulders
        - arms
        - legs
        - abs
      example: chest

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: プログラムで判定するためのエラーコード
              example: invalid_month
            message:
              type: string
              description: 人が読むためのエラーメッセージ
              example: month は YYYY-MM 形式で指定してください
